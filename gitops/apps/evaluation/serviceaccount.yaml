# O nome desta ServiceAccount ("evaluation") tem que bater exatamente com
# o que a trust policy da role IRSA espera:
# infra/envs/dev/main.tf -> "system:serviceaccount:togglemaster:evaluation"
# Se o nome mudar aqui (ou o namespace), a role para de poder ser assumida
# e o pod recebe "AccessDenied"/credenciais vazias ao chamar o SQS.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: evaluation
  namespace: togglemaster
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::383996694340:role/togglemaster-evaluation-irsa
