# ServiceAccount dedicada (em vez de usar a "default" do namespace) so por
# clareza/least-privilege - o "auth" nao precisa de nenhuma permissao AWS
# (nao fala com SQS, DynamoDB nem Secrets Manager em runtime), entao nao
# leva a anotacao "eks.amazonaws.com/role-arn" que o "evaluation" e o
# "analytics" tem.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth
  namespace: togglemaster
