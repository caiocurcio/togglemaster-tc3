name: CI - targeting

on:
  push:
    branches: [main]
    paths:
      - "services/targeting/**"
      - ".github/workflows/ci-targeting.yml"
      - ".github/workflows/_reusable-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/targeting/**"
      - ".github/workflows/ci-targeting.yml"
      - ".github/workflows/_reusable-ci.yml"
  workflow_dispatch: {}

# contents: write (Task 12) - o job "update-gitops" do workflow reutilizavel
# precisa dar commit/push em gitops/apps/targeting/deployment.yaml apos
# publicar a imagem no ECR. Sem isso aqui, mesmo com o reusable-ci.yml
# pedindo "write", a permissao efetiva ainda cairia pra "read" (o chamador
# sempre limita o que o workflow chamado pode fazer).
permissions:
  id-token: write
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/_reusable-ci.yml
    with:
      service: targeting
