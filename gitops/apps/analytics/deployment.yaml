# Sem Secret nenhum aqui tambem: o "analytics" assume a role IRSA da sua
# ServiceAccount (ver serviceaccount.yaml) pra ler/apagar mensagens do SQS
# e gravar/consultar no DynamoDB - nenhuma credencial fixa.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics
  namespace: togglemaster
  labels:
    app: analytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics
  template:
    metadata:
      labels:
        app: analytics
    spec:
      serviceAccountName: analytics
      containers:
        - name: analytics
          image: 383996694340.dkr.ecr.us-east-1.amazonaws.com/togglemaster/analytics:67eacfe
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: AWS_REGION
              value: "us-east-1"
            - name: SQS_QUEUE_URL
              value: "https://sqs.us-east-1.amazonaws.com/383996694340/toggle-master-evaluation-events"
            - name: DYNAMODB_TABLE
              value: "ToggleMasterAnalytics"
            - name: RUN_CONSUMER
              value: "true"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
