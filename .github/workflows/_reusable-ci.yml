name: CI reutilizavel (lint, test, SAST, SCA, build, scan, push e atualiza gitops)

# "workflow_call" transforma este arquivo em algo que outros workflows podem
# chamar como se fosse uma função - evita repetir os mesmos ~10 steps 5 vezes
# (um por microsservico). Quem chama passa qual servico rodar em `inputs.service`.
on:
  workflow_call:
    inputs:
      service:
        description: "Nome do microsservico: pasta em services/<service> e nome do repositorio ECR"
        required: true
        type: string
    outputs:
      image_tag:
        description: "Tag da imagem publicada no ECR (sha curto do commit)"
        value: ${{ jobs.build-scan-push.outputs.image_tag }}

# Permissoes no nivel do workflow = o TETO que qualquer job aqui dentro pode
# pedir (nenhum job consegue pedir mais que isso, so' menos). id-token: write
# e' o que permite pedir um token OIDC ao GitHub pra trocar por credenciais
# temporarias da AWS. contents: write e' novo (Task 12) - so' o job
# "update-gitops" de fato usa pra dar commit/push; os demais jobs abaixo
# reduzem explicitamente pra "read" (principio de minimo privilegio).
#
# IMPORTANTE: quem CHAMA este workflow (ci-<servico>.yml) tambem precisa
# declarar "contents: write" nas permissoes dele - a permissao efetiva e' a
# interseccao das duas, entao se o chamador continuar em "read" o push do
# job update-gitops falha por falta de permissao, mesmo com isso aqui certo.
permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: togglemaster/${{ inputs.service }}

jobs:
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install flake8
      - name: flake8 (usa o .flake8 da raiz do repo)
        run: flake8 "services/${{ inputs.service }}"

  test:
    name: Testes unitarios (pytest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instala dependencias do servico
        working-directory: services/${{ inputs.service }}
        run: |
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      - name: Roda pytest
        working-directory: services/${{ inputs.service }}
        # "python -m pytest" (em vez de so' "pytest") garante que o diretorio
        # atual (services/<servico>, onde mora o app.py) entra no sys.path.
        # Sem o "python -m", o pytest só' adiciona services/<servico>/tests
        # ao path (porque tests/ nao tem __init__.py) e o "import app" dos
        # testes falha com ModuleNotFoundError.
        run: python -m pytest -v

  sast:
    name: SAST (bandit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install bandit
      # -ll = so falha (exit code != 0) em achados de severidade MEDIUM ou HIGH;
      # ignora LOW (muito ruidoso e raramente acionavel num projeto pequeno).
      - name: Bandit - analise estatica de seguranca do codigo Python
        run: bandit -r "services/${{ inputs.service }}" -x "services/${{ inputs.service }}/tests" -ll

  sca:
    name: SCA (trivy - dependencias do requirements.txt)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan - bloqueia em vulnerabilidade CRITICAL
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: services/${{ inputs.service }}
          severity: CRITICAL
          exit-code: "1"
          # Lista de CVEs aceitas (com justificativa) na raiz do repo - ver
          # o arquivo .trivyignore para o motivo de cada uma.
          trivyignores: .trivyignore

  build-scan-push:
    name: Build da imagem, scan e push no ECR
    runs-on: ubuntu-latest
    needs: [lint, test, sast, sca]
    permissions:
      id-token: write
      contents: read
    outputs:
      image_tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Define a tag da imagem (sha curto do commit)
        id: tag
        run: echo "value=$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      # OIDC: nenhuma access key fixa guardada como secret do repositorio.
      # A role (criada via Terraform em infra/modules/github-oidc) so aceita
      # ser assumida por um token vindo deste repositorio, e so tem permissao
      # de dar push/pull nos ECRs deste projeto.
      - name: Autentica na AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build da imagem Docker
        working-directory: services/${{ inputs.service }}
        run: docker build -t "local/${{ inputs.service }}:${{ steps.tag.outputs.value }}" .

      - name: Trivy image scan - bloqueia em vulnerabilidade CRITICAL
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/${{ inputs.service }}:${{ steps.tag.outputs.value }}
          severity: CRITICAL
          exit-code: "1"
          # Mesma lista de CVEs aceitas usada no job "sca" (arquivo na raiz
          # do repo). Cobre os achados que vem da camada base do Debian
          # (python:3.11-slim), fora do nosso controle direto.
          trivyignores: .trivyignore

      - name: Tag e push no ECR
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker tag "local/${{ inputs.service }}:${{ steps.tag.outputs.value }}" \
            "$REGISTRY/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.value }}"
          docker push "$REGISTRY/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.value }}"

  update-gitops:
    name: Atualiza a tag da imagem no GitOps (Task 12)
    runs-on: ubuntu-latest
    needs: build-scan-push
    # So roda em push de verdade na main - nunca em pull_request (PR ainda
    # nao foi mergeado, entao nao faz sentido - e nem teria permissao de
    # escrita - atualizar o que esta rodando em producao a partir dele).
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Atualiza gitops/apps/<servico>/deployment.yaml com a nova tag
        env:
          SERVICE: ${{ inputs.service }}
          IMAGE_TAG: ${{ needs.build-scan-push.outputs.image_tag }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          MANIFEST="gitops/apps/${SERVICE}/deployment.yaml"

          # Troca so' o que vem depois de ".../togglemaster/<servico>:" na
          # linha "image:", preservando o resto da linha (indentacao, etc.).
          sed -i "s|\(image: .*togglemaster/${SERVICE}:\).*|\1${IMAGE_TAG}|" "$MANIFEST"

          git add "$MANIFEST"

          if git diff --cached --quiet; then
            echo "Tag ja estava atualizada (${IMAGE_TAG}) - nada para commitar."
            exit 0
          fi

          git commit -m "chore(gitops): atualiza imagem de ${SERVICE} para ${IMAGE_TAG}"

          # Retry com "pull --rebase": se outro servico (build disparado no
          # mesmo push, ex.: commit que mexeu em varios services/ ao mesmo
          # tempo) already deu push antes deste job terminar, o primeiro
          # "git push" seria rejeitado por a branch local estar desatualizada.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push feito com sucesso (tentativa $i)."
              exit 0
            fi
            echo "Push rejeitado (provavelmente outro servico commitou ao mesmo tempo) - tentativa $i, atualizando e tentando de novo..."
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 5 + 1))
          done

          echo "Nao foi possivel dar push apos 5 tentativas." >&2
          exit 1
